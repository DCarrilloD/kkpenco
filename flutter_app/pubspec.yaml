name: kkpenco
description: A modern Flutter mobile application rewriting the Antigravity Flet app.

publish_to: 'none'

version: 1.0.1+4

environment:
  sdk: ">=3.0.0 <4.0.0"

dependencies:
  flutter:
    sdk: flutter
  http: ^1.2.0
  shared_preferences: ^2.2.2
  firebase_core: ^4.11.0
  firebase_auth: ^6.5.4
  cloud_firestore: ^6.6.0
  intl: ^0.19.0
  google_fonts: ^6.2.1
  csv: ^6.0.0
  path_provider: ^2.1.2
  share_plus: ^12.0.2
  window_manager: ^0.5.1
  excel: ^4.0.6
  local_auth: ^3.0.1
  audioplayers: ^6.7.1
  image_picker: ^1.2.2
  geolocator: ^14.0.2
  url_launcher: ^6.3.2
  flutter_map: ^8.3.1
  latlong2: ^0.10.1
  home_widget: ^0.9.3
  file_picker: ^11.0.2
  firebase_messaging: ^16.4.1
  flutter_local_notifications: ^22.0.1
  flutter_riverpod: ^3.3.2
  firebase_storage: ^13.4.3
  cached_network_image: ^3.4.1
  flutter_displaymode: ^0.7.0
  flame: ^1.37.0
  flame_audio: ^2.12.1
  connectivity_plus: ^7.2.0

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0
  flutter_launcher_icons: ^0.13.1

flutter_launcher_icons:
  android: "launcher_icon"
  ios: true
  image_path: "assets/icon.png"
  min_sdk_android: 21

flutter:
  uses-material-design: true
  assets:
    - assets/
    - assets/images/
    - assets/games/
    - assets/audio/
